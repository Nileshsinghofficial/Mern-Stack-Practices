<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create app using cdn</title>
  </head>
  <body>
    <div id="main">Loading.....</div>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <script>
      // React.createElement(type(tags), props, children)
      const h1 = React.createElement(
        "h1",
        {
          key: 1,
          className: "mains",
          style: { backgroundColor: "red", margin: "30px" },
        },
        "Nilesh Singh"
      );
      const h2 = React.createElement(
        "h2",
        {
          key: 2,
          className: "main2",
          style: { backgroundColor: "orange", margin: "30px" },
        },
        "Nigam Singh"
      );

      const div = React.createElement(
        "div",
        {
          key: 3,
          className: "or-main",
          style: { backgroundColor: "yello", margin: "30px" },
        },
        [
          h1,
          h2,
          React.createElement(
            "h3",
            {
              key: 4,
              className: "Divh3",
              style: { backgroundColor: "purple", margin: "30px" },
            },
            "Work hard"
          ),
        ]
      );

      const root = ReactDOM.createRoot(document.getElementById("main"));
      // console.log(root)
      root.render(div);
    </script>
  </body>
</html>
